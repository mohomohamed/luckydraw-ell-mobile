<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Draw</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #0b0b0c;
      --panel: #131315;
      --panel-2: #18181b;
      --text: #f5f5f3;
      --muted: #8c8c92;
      --line: rgba(255,255,255,.08);
      --accent: #f1ff54;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 40%, rgba(241,255,84,.08), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.025), transparent 50%);
      pointer-events: none;
    }

    .app {
      width: min(1100px, 100%);
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 20px rgba(241,255,84,.45);
    }

    .stage {
      min-height: min(72vh, 700px);
      border: 1px solid var(--line);
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.012));
      padding: clamp(30px, 5vw, 64px);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 35px 100px rgba(0,0,0,.35);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, transparent, black 20%, black 80%, transparent);
      pointer-events: none;
    }

    .content {
      width: min(820px, 100%);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .18em;
      margin-bottom: 18px;
    }

    .draw-display {
      min-height: 240px;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      position: relative;
    }

    .name {
      font-size: clamp(44px, 8vw, 92px);
      line-height: .95;
      font-weight: 900;
      letter-spacing: -.065em;
      max-width: 100%;
      word-break: break-word;
      transition: transform .18s ease, opacity .18s ease, filter .18s ease;
      text-wrap: balance;
    }

    .name.shuffling {
      opacity: .75;
      filter: blur(.35px);
      transform: scale(.985);
    }

    .name.winner {
      color: var(--accent);
      transform: scale(1.04);
      text-shadow: 0 0 36px rgba(241,255,84,.12);
    }

    .participant-number {
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
      min-height: 18px;
    }

    .controls {
      margin-top: 34px;
      display: flex;
      justify-content: center;
    }

    .draw-btn {
      border: 0;
      min-width: 210px;
      border-radius: 999px;
      padding: 16px 28px;
      background: var(--accent);
      color: #0b0b0c;
      font: inherit;
      font-weight: 850;
      font-size: 15px;
      letter-spacing: -.01em;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(241,255,84,.08);
      transition: transform .18s ease, opacity .18s ease;
    }

    .draw-btn:hover { transform: translateY(-1px); }
    .draw-btn:active { transform: translateY(0) scale(.985); }
    .draw-btn:disabled { opacity: .45; cursor: not-allowed; }

    .status {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .counter strong {
      color: var(--text);
      font-weight: 700;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(241,255,84,.6);
    }

    .flash {
      position: fixed;
      inset: 0;
      background: rgba(241,255,84,.12);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
    }

    .flash.active {
      animation: flash .65s ease;
    }

    @keyframes flash {
      0% { opacity: 0; }
      20% { opacity: 1; }
      100% { opacity: 0; }
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 15;
    }

    .confetti span {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 16px;
      background: var(--accent);
      border-radius: 2px;
      animation: fall 1.7s ease-out forwards;
    }

    @keyframes fall {
      to {
        transform: translate3d(var(--x), 110vh, 0) rotate(var(--r));
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 16px;
        overflow: auto;
      }

      .stage {
        min-height: 72vh;
        border-radius: 24px;
        padding: 28px 18px;
      }

      .draw-display {
        min-height: 200px;
      }

      .footer {
        flex-direction: column;
        align-items: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="confetti" id="confetti"></div>

  <main class="app">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        Lucky Draw
      </div>
      <div>Live Random Selection</div>
    </div>

    <section class="stage">
      <div class="content">
        <div class="eyebrow">90 Participants</div>

        <div class="draw-display">
          <div>
            <div class="name" id="nameDisplay">Ready to Draw</div>
            <div class="participant-number" id="participantNumber"></div>
          </div>
        </div>

        <div class="controls">
          <button class="draw-btn" id="drawBtn">Start Draw</button>
        </div>

        <div class="status" id="status">Press start to select one random winner.</div>
      </div>
    </section>

    <div class="footer">
      <div class="counter">
        <span class="pulse"></span>
        <span><strong>90</strong> eligible participants</span>
      </div>
      <div>One winner · fair random draw</div>
    </div>
  </main>

  <script>
    // Replace these sample entries with your real 90 customer names.
    const participants = Array.from({ length: 90 }, (_, i) => ({
      id: i + 1,
      name: `Customer ${String(i + 1).padStart(2, "0")}`
    }));

    const nameDisplay = document.getElementById("nameDisplay");
    const participantNumber = document.getElementById("participantNumber");
    const drawBtn = document.getElementById("drawBtn");
    const status = document.getElementById("status");
    const flash = document.getElementById("flash");
    const confetti = document.getElementById("confetti");

    let drawing = false;

    function randomParticipant() {
      return participants[Math.floor(Math.random() * participants.length)];
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function createConfetti() {
      confetti.innerHTML = "";

      const pieces = 42;

      for (let i = 0; i < pieces; i++) {
        const piece = document.createElement("span");

        piece.style.left = `${Math.random() * 100}%`;
        piece.style.setProperty("--x", `${(Math.random() - 0.5) * 260}px`);
        piece.style.setProperty("--r", `${Math.random() * 900 - 450}deg`);
        piece.style.animationDelay = `${Math.random() * 0.25}s`;

        if (i % 3 === 1) piece.style.background = "#ffffff";
        if (i % 3 === 2) piece.style.background = "#8c8c92";

        confetti.appendChild(piece);
      }

      setTimeout(() => {
        confetti.innerHTML = "";
      }, 2200);
    }

    async function drawWinner() {
      if (drawing) return;

      drawing = true;
      drawBtn.disabled = true;
      drawBtn.textContent = "Drawing…";
      status.textContent = "Selecting randomly…";
      participantNumber.textContent = "";
      nameDisplay.classList.remove("winner");
      nameDisplay.classList.add("shuffling");

      const winner = randomParticipant();

      // Fast shuffle
      for (let i = 0; i < 28; i++) {
        const person = randomParticipant();
        nameDisplay.textContent = person.name;
        await wait(45);
      }

      // Controlled slowdown
      const delays = [65, 75, 90, 110, 135, 165, 205, 255, 320, 420];

      for (const delay of delays) {
        const person = randomParticipant();
        nameDisplay.textContent = person.name;
        await wait(delay);
      }

      await wait(180);

      nameDisplay.classList.remove("shuffling");
      nameDisplay.textContent = winner.name;
      participantNumber.textContent = `Participant #${String(winner.id).padStart(2, "0")}`;
      nameDisplay.classList.add("winner");

      status.textContent = "Winner selected";
      flash.classList.remove("active");
      void flash.offsetWidth;
      flash.classList.add("active");
      createConfetti();

      drawBtn.textContent = "Draw Again";
      drawBtn.disabled = false;
      drawing = false;
    }

    drawBtn.addEventListener("click", drawWinner);
  </script>
</body>
</html>
